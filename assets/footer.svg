<line x1="380" y1="96" x2="820" y2="96" stroke="url(#g)" stroke-width="2.5" stroke-dasharray="70 500"><animate attributeName="stroke-dashoffset" from="570" to="0" dur="4s" repeatCount="indefinite"/></line></svg>