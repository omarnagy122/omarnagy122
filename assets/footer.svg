<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150"><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff5e7e"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.5" stop-color="#141b3a"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6366f1" fill-opacity="0.18"/></pattern>
</defs>
<rect width="1200" height="150" fill="url(#bg)"/><rect width="1200" height="150" fill="url(#dots)"/>
<text x="600" y="68" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="28" font-weight="700" fill="url(#g)" filter="url(#glow)" letter-spacing="5">BUILDING INTELLIGENT SYSTEMS</text>
